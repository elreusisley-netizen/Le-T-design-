<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0f1626">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="VIRAL Admin">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="manifest" href="./manifest.json">
<title>VIRAL Admin</title>
<style>
  :root{
    --bg:#0f1626; --card:#16223a; --card2:#1b2945; --line:#2a3650;
    --ink:#f3efe4; --ink2:#b9b3a4; --muted:#8a8577;
    --gold:#c39a3f; --mark:#b38c3a; --goldsoft:rgba(195,154,63,.16);
    --bad:#e0796b; --sbtm:env(safe-area-inset-bottom,0px); --stop:env(safe-area-inset-top,0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  body{min-height:100dvh}
  .serif{font-family:'Cormorant Garamond','Times New Roman',serif}
  header{position:sticky;top:0;z-index:20;background:linear-gradient(180deg,#1a2740,#131c30);border-bottom:2px solid var(--gold);
    padding:calc(var(--stop) + 10px) 16px 10px}
  .hrow{display:flex;align-items:center;gap:10px}
  .mark{width:30px;height:30px;border-radius:8px;flex:none;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(120% 120% at 30% 20%,#e6c869,#b8862d);color:#1a2740;font:700 16px 'Cormorant Garamond',serif}
  .htitle{flex:1;min-width:0;font:600 20px 'Cormorant Garamond','Times New Roman',serif;letter-spacing:.3px}
  .htitle b{color:var(--gold);font-weight:600}
  .ibtn{height:34px;min-width:34px;padding:0 10px;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.06);color:var(--ink);border-radius:9px;font-size:13px;cursor:pointer}
  .periods{display:flex;gap:6px;margin-top:10px}
  .periods button{flex:1;padding:8px 0;border-radius:9px;border:none;background:rgba(255,255,255,.06);color:var(--ink2);font-size:13px;font-weight:600;cursor:pointer}
  .periods button.on{background:var(--ink);color:#16223a}
  main{padding:14px 14px calc(84px + var(--sbtm));max-width:720px;margin:0 auto}
  h2{font:600 22px 'Cormorant Garamond','Times New Roman',serif;margin:18px 2px 10px;display:flex;align-items:center;gap:8px}
  h2::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 3px var(--goldsoft)}
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px}
  .card.wide{grid-column:1/-1}
  .k{font-size:12px;color:var(--ink2);line-height:1.3}
  .v{font-size:28px;font-weight:700;letter-spacing:-.5px;margin-top:6px;font-variant-numeric:tabular-nums}
  .v.big{font-size:40px}
  .s{font-size:11.5px;color:var(--muted);margin-top:4px;line-height:1.35}
  .tag{display:inline-block;font-size:10.5px;font-weight:600;padding:2px 7px;border-radius:999px;background:var(--goldsoft);color:var(--gold);margin-left:4px;vertical-align:1px}
  .note{font-size:12.5px;color:var(--ink2);line-height:1.5;background:var(--card2);border:1px solid var(--line);border-left:3px solid var(--gold);border-radius:12px;padding:11px 13px;margin:10px 0}
  .chart{position:relative;margin-top:8px}
  .chart svg{display:block;width:100%;height:auto;overflow:visible;touch-action:pan-y}
  .tip{position:absolute;pointer-events:none;background:#0b1120;border:1px solid var(--line);border-radius:9px;padding:6px 9px;font-size:12px;white-space:nowrap;transform:translate(-50%,-100%);display:none;z-index:3}
  .tip b{display:block;font-size:14px}
  details{margin-top:8px}
  summary{font-size:12px;color:var(--ink2);cursor:pointer;padding:6px 0}
  table{width:100%;border-collapse:collapse;font-size:12px;font-variant-numeric:tabular-nums}
  td,th{padding:5px 4px;border-bottom:1px solid var(--line);text-align:right}
  td:first-child,th:first-child{text-align:left}
  th{color:var(--ink2);font-weight:600}
  .bars .row{display:grid;grid-template-columns:96px 1fr 34px;align-items:center;gap:8px;margin:9px 0;font-size:13px}
  .bars .track{height:12px;position:relative}
  .bars .fill{position:absolute;left:0;top:0;bottom:0;background:var(--mark);border-radius:0 4px 4px 0;min-width:2px}
  .bars .n{text-align:right;font-variant-numeric:tabular-nums}
  .bars .sub{grid-column:2/4;font-size:11px;color:var(--muted);margin-top:-6px}
  nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;background:linear-gradient(180deg,#1a2740,#101827);border-top:1px solid rgba(255,255,255,.08);padding-bottom:var(--sbtm)}
  nav button{flex:1;padding:12px 2px 13px;border:none;background:none;color:#b9b3a4;font-size:11.5px;font-weight:500;position:relative;cursor:pointer}
  nav button.on{color:var(--gold)}
  nav button.on::before{content:"";position:absolute;top:0;left:24%;right:24%;height:2px;background:var(--gold);border-radius:2px}
  .center{min-height:70dvh;display:flex;flex-direction:column;justify-content:center;max-width:420px;margin:0 auto}
  .center .card{padding:20px}
  .center h1{font:600 28px 'Cormorant Garamond','Times New Roman',serif;margin:0 0 6px}
  .center p{color:var(--ink2);font-size:14px;line-height:1.5;margin:0 0 16px}
  input{width:100%;padding:13px 14px;font-size:16px;border-radius:12px;border:1px solid var(--line);background:#0f1729;color:var(--ink);margin-bottom:10px}
  input:focus{outline:none;border-color:var(--gold)}
  .btn{width:100%;padding:13px;border-radius:12px;border:1px solid var(--gold);background:var(--gold);color:#16223a;font-size:15px;font-weight:700;cursor:pointer}
  .btn.ghost{background:none;color:var(--ink);border-color:var(--line);font-weight:600;margin-top:8px}
  .btn:disabled{opacity:.55}
  .msg{font-size:13px;color:var(--ink2);margin-top:10px;min-height:18px}
  .msg.err,.err{color:var(--bad)}
  .skel{height:84px;border-radius:18px;background:linear-gradient(90deg,var(--card) 0%,var(--card2) 50%,var(--card) 100%);background-size:200% 100%;animation:sk 1.2s ease-in-out infinite}
  @keyframes sk{0%{background-position:100% 0}100%{background-position:-100% 0}}
  .user{display:grid;grid-template-columns:1fr auto;gap:4px 10px}
  .user .em{font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis}
  .pill{font-size:11px;font-weight:600;padding:3px 8px;border-radius:999px;background:rgba(255,255,255,.08);color:var(--ink2);justify-self:end;align-self:start}
  .pill.ok{background:rgba(120,190,140,.16);color:#9fd3ad}
  .pill.warn{background:rgba(224,121,107,.16);color:#efa497}
  .user dl{grid-column:1/-1;display:grid;grid-template-columns:auto 1fr;gap:3px 12px;margin:6px 0 0;font-size:12px}
  .user dt{color:var(--muted)} .user dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}
  .stack{display:flex;flex-direction:column;gap:10px}
  .hidden{display:none!important}
</style>
</head>
<body>
<header id="hdr" class="hidden">
  <div class="hrow">
    <div class="mark">V</div>
    <div class="htitle">VIRAL <b>Admin</b></div>
    <button class="ibtn" id="btnRefresh" aria-label="Actualiser" onclick="charger()">↻</button>
    <button class="ibtn" onclick="deconnexion()">Quitter</button>
  </div>
  <div class="periods" id="periods">
    <button data-d="7">7 jours</button><button data-d="30" class="on">30 jours</button><button data-d="90">90 jours</button>
  </div>
</header>

<main id="main"></main>

<nav id="nav" class="hidden">
  <button data-t="apercu" class="on">Synthèse</button>
  <button data-t="creations">Créations</button>
  <button data-t="installs">Installations</button>
  <button data-t="comptes">Comptes</button>
</nav>

<script src="../supabase-config.js"></script>
<script src="../viral-backend.js"></script>
<script>
/* =====================================================================
   VIRAL Admin — tableau de bord privé.
   Cette page ne contient AUCUNE donnée ni clé secrète : tout est lu via
   les fonctions admin_overview / admin_users, qui vérifient côté serveur
   (Supabase) que le compte connecté est administrateur. Un visiteur qui
   ouvre cette URL ne voit que l'écran de connexion.
   ===================================================================== */
var NOMS = {tshirt:'T-shirt', sweat:'Sweat', hoodie:'Sweat à capuche', puffer:'Doudoune', track:'Survêtement', cap:'Casquette'};
var PLAT = {ios:'iPhone / iPad', android:'Android', desktop:'Ordinateur', other:'Autre'};
var etat = { jours: 30, onglet: 'apercu', data: null, users: [], usersTotal: 0, chargement: false };
var main = document.getElementById('main');
var nf = new Intl.NumberFormat('fr-FR');
function n(x){ return nf.format(x || 0); }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function dateFr(s, heure){ if(!s) return '—'; var d = new Date(s); return d.toLocaleDateString('fr-FR', {day:'numeric', month:'short', year: (d.getFullYear() !== new Date().getFullYear()) ? 'numeric' : undefined}) + (heure ? ' · ' + d.toLocaleTimeString('fr-FR', {hour:'2-digit', minute:'2-digit'}) : ''); }
function jourCourt(s){ var p = s.split('-'); return +p[2] + '/' + +p[1]; }

/* ---------------- écrans hors tableau de bord ---------------- */
function ecran(html){ document.getElementById('hdr').classList.add('hidden'); document.getElementById('nav').classList.add('hidden'); main.innerHTML = '<div class="center">' + html + '</div>'; }

function ecranConfig(){
  ecran('<div class="card"><h1>Configuration requise</h1><p>Le fichier <b>supabase-config.js</b> n’est pas encore rempli. Ajoute l’URL du projet et la clé publique Supabase, puis recharge cette page.</p></div>');
}
var codeEnvoye = false, emailSaisi = '';
function ecranConnexion(msg){
  ecran('<div class="card"><div class="mark" style="width:44px;height:44px;font-size:24px;border-radius:12px;margin-bottom:14px">V</div>'
    + '<h1>Espace administrateur</h1><p>Accès réservé. Connecte-toi avec l’e-mail de ton compte administrateur : tu reçois un code (ou un lien) de connexion.</p>'
    + '<input type="email" id="em" inputmode="email" autocomplete="email" placeholder="ton@email.com" value="' + esc(emailSaisi) + '">'
    + '<input type="text" id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="10" placeholder="Code reçu par e-mail" class="' + (codeEnvoye ? '' : 'hidden') + '">'
    + '<button class="btn" id="go">' + (codeEnvoye ? 'Se connecter' : 'Recevoir un code') + '</button>'
    + '<div class="msg" id="msg">' + esc(msg || '') + '</div></div>');
  document.getElementById('go').onclick = connexion;
  document.getElementById('em').oninput = function(){ if(codeEnvoye){ codeEnvoye = false; ecranConnexion(); } };
}
function connexion(){
  var em = document.getElementById('em').value.trim(), go = document.getElementById('go'), m = document.getElementById('msg');
  emailSaisi = em;
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)){ m.className = 'msg err'; m.textContent = 'Adresse e-mail invalide.'; return; }
  go.disabled = true; m.className = 'msg';
  if(!codeEnvoye){
    m.textContent = 'Envoi du code…';
    VB.sendCode(em).then(function(){ codeEnvoye = true; ecranConnexion('Code envoyé. Vérifie aussi les spams.'); setTimeout(function(){ var c = document.getElementById('code'); if(c) c.focus(); }, 50); })
      .catch(function(e){ m.className = 'msg err'; m.textContent = e.status === 429 ? 'Trop de demandes, réessaie dans une minute.' : 'Envoi impossible : ' + e.message; go.disabled = false; });
  } else {
    m.textContent = 'Vérification…';
    VB.verifyCode(em, document.getElementById('code').value).then(function(){ codeEnvoye = false; verifierAcces(); })
      .catch(function(){ m.className = 'msg err'; m.textContent = 'Code incorrect ou expiré.'; go.disabled = false; });
  }
}
function ecranRefus(){
  ecran('<div class="card"><h1>Accès refusé</h1><p>Le compte <b>' + esc(VB.emailMasque()) + '</b> n’a pas le rôle administrateur. Aucune donnée n’a été transmise.</p>'
    + '<button class="btn ghost" onclick="deconnexion()">Changer de compte</button></div>');
}
function ecranErreur(msg){
  ecran('<div class="card"><h1>Connexion impossible</h1><p class="err">' + esc(msg) + '</p><button class="btn" onclick="verifierAcces()">Réessayer</button><button class="btn ghost" onclick="deconnexion()">Se déconnecter</button></div>');
}
function deconnexion(){ VB.signOut().then(function(){ etat.data = null; ecranConnexion(); }); }

/* ---------------- contrôle d'accès (le serveur décide) ---------------- */
function verifierAcces(){
  ecran('<div class="stack"><div class="skel"></div><div class="skel"></div></div>');
  VB.rpc('is_admin').then(function(ok){
    if(ok !== true){ ecranRefus(); return; }
    document.getElementById('hdr').classList.remove('hidden'); document.getElementById('nav').classList.remove('hidden');
    charger();
  }).catch(function(e){
    if(e.status === 401){ ecranConnexion('Session expirée, reconnecte-toi.'); return; }
    ecranErreur(navigator.onLine === false ? 'Pas de connexion internet.' : e.message);
  });
}

/* ---------------- données ---------------- */
function charger(){
  if(etat.chargement) return; etat.chargement = true;
  var btn = document.getElementById('btnRefresh'); btn.disabled = true;
  if(!etat.data) main.innerHTML = '<div class="stack" style="margin-top:14px"><div class="skel"></div><div class="skel"></div><div class="skel"></div></div>';
  Promise.all([VB.rpc('admin_overview', {p_days: etat.jours}), VB.rpc('admin_users', {p_limit: 50, p_offset: 0})])
    .then(function(r){ etat.data = r[0]; etat.users = r[1] || []; etat.usersTotal = (r[1] && r[1][0]) ? r[1][0].total_count : 0; rendre(); })
    .catch(function(e){
      if(e.code === '42501' || e.status === 403){ ecranRefus(); return; }
      if(e.status === 401){ ecranConnexion('Session expirée, reconnecte-toi.'); return; }
      main.innerHTML = '<div class="note err" style="margin-top:16px">Impossible de charger les statistiques : ' + esc(navigator.onLine === false ? 'pas de connexion internet.' : e.message) + '</div><button class="btn" onclick="charger()">Réessayer</button>';
    })
    .then(function(){ etat.chargement = false; btn.disabled = false; });
}
function plusDeComptes(){
  var b = document.getElementById('plus'); if(b){ b.disabled = true; b.textContent = 'Chargement…'; }
  VB.rpc('admin_users', {p_limit: 50, p_offset: etat.users.length}).then(function(l){ etat.users = etat.users.concat(l || []); rendre(); })
    .catch(function(e){ if(b){ b.disabled = false; b.textContent = 'Erreur : ' + e.message + ' — réessayer'; } });
}

document.getElementById('periods').onclick = function(ev){
  var b = ev.target.closest('button'); if(!b) return;
  etat.jours = +b.getAttribute('data-d');
  this.querySelectorAll('button').forEach(function(x){ x.classList.toggle('on', x === b); });
  charger();
};
document.getElementById('nav').onclick = function(ev){
  var b = ev.target.closest('button'); if(!b) return;
  etat.onglet = b.getAttribute('data-t');
  this.querySelectorAll('button').forEach(function(x){ x.classList.toggle('on', x === b); });
  rendre(); window.scrollTo(0, 0);
};

/* ---------------- graphiques (SVG, une seule série, survol / toucher) ---------------- */
function tableHTML(rows, cols){
  return '<details><summary>Voir les données</summary><table><tr>' + cols.map(function(c){ return '<th>' + c[0] + '</th>'; }).join('') + '</tr>'
    + rows.map(function(r){ return '<tr>' + cols.map(function(c){ return '<td>' + c[1](r) + '</td>'; }).join('') + '</tr>'; }).join('') + '</table></details>';
}
function echelle(max){
  if(max <= 4) return {max: 4, ticks: [0, 2, 4]};
  var p = Math.pow(10, Math.floor(Math.log10(max))), m = Math.ceil(max / p) * p;
  if(m / p > 5 && m % (2*p)) m += p;
  return {max: m, ticks: [0, m/2, m]};
}
/* type : 'line' ou 'col' ; pts : [{x:'2026-10-01', y:3}] */
function graphique(id, pts, type, unite){
  var box = document.getElementById(id); if(!box) return;
  var W = Math.max(280, box.clientWidth || 320), H = 170, L = 30, R = 10, T = 12, B = 22;
  var iw = W - L - R, ih = H - T - B, nb = pts.length;
  var max = Math.max.apply(null, pts.map(function(p){ return p.y; }).concat([0]));
  var sc = echelle(max), Y = function(v){ return T + ih - (v / sc.max) * ih; };
  var slot = iw / Math.max(1, nb), X = function(i){ return L + slot * (i + .5); };
  var s = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + esc(unite) + '">';
  sc.ticks.forEach(function(t){ s += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + Y(t) + '" y2="' + Y(t) + '" stroke="#2a3650" stroke-width="1"/>'
    + '<text x="' + (L - 6) + '" y="' + (Y(t) + 4) + '" text-anchor="end" font-size="10" fill="#8a8577">' + n(t) + '</text>'; });
  var step = Math.ceil(nb / 6);
  pts.forEach(function(p, i){ if(i % step === 0 || i === nb - 1) s += '<text x="' + X(i) + '" y="' + (H - 5) + '" text-anchor="middle" font-size="10" fill="#8a8577">' + jourCourt(p.x) + '</text>'; });
  if(type === 'col'){
    var bw = Math.max(2, Math.min(24, slot - 2));
    pts.forEach(function(p, i){
      if(p.y <= 0) return;
      var x = X(i) - bw/2, y = Y(p.y), h = T + ih - y, r = Math.min(4, bw/2, h);
      s += '<path d="M' + x + ' ' + (T+ih) + 'V' + (y + r) + 'Q' + x + ' ' + y + ' ' + (x + r) + ' ' + y + 'H' + (x + bw - r) + 'Q' + (x + bw) + ' ' + y + ' ' + (x + bw) + ' ' + (y + r) + 'V' + (T+ih) + 'Z" fill="#b38c3a"/>';
    });
  } else {
    var d = pts.map(function(p, i){ return (i ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(p.y).toFixed(1); }).join('');
    s += '<path d="' + d + 'L' + X(nb-1) + ' ' + (T+ih) + 'L' + X(0) + ' ' + (T+ih) + 'Z" fill="#b38c3a" opacity=".12"/>';
    s += '<path d="' + d + '" fill="none" stroke="#b38c3a" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
    var l = pts[nb-1]; s += '<circle cx="' + X(nb-1) + '" cy="' + Y(l.y) + '" r="4" fill="#b38c3a" stroke="#16223a" stroke-width="2"/>';
  }
  s += '<line class="cross" x1="0" x2="0" y1="' + T + '" y2="' + (T+ih) + '" stroke="#8a8577" stroke-width="1" visibility="hidden"/>';
  s += '<circle class="dot" r="4" fill="#b38c3a" stroke="#16223a" stroke-width="2" visibility="hidden"/>';
  s += '<rect x="' + L + '" y="0" width="' + iw + '" height="' + H + '" fill="transparent"/></svg><div class="tip"></div>';
  box.innerHTML = s;
  var svg = box.querySelector('svg'), tip = box.querySelector('.tip'), cross = svg.querySelector('.cross'), dot = svg.querySelector('.dot');
  function montrer(ev){
    var r = svg.getBoundingClientRect(), x = (ev.clientX - r.left) * (W / r.width);
    var i = Math.max(0, Math.min(nb - 1, Math.floor((x - L) / slot))), p = pts[i];
    cross.setAttribute('x1', X(i)); cross.setAttribute('x2', X(i)); cross.setAttribute('visibility', 'visible');
    if(type === 'line'){ dot.setAttribute('cx', X(i)); dot.setAttribute('cy', Y(p.y)); dot.setAttribute('visibility', 'visible'); }
    tip.innerHTML = '<b>' + n(p.y) + '</b>' + esc(unite) + ' · ' + new Date(p.x + 'T12:00:00').toLocaleDateString('fr-FR', {weekday:'short', day:'numeric', month:'short'});
    tip.style.display = 'block'; tip.style.left = Math.max(60, Math.min(r.width - 60, X(i) * r.width / W)) + 'px'; tip.style.top = (Y(p.y) * r.height / H - 8) + 'px';
  }
  function cacher(){ tip.style.display = 'none'; cross.setAttribute('visibility', 'hidden'); dot.setAttribute('visibility', 'hidden'); }
  svg.addEventListener('pointermove', montrer); svg.addEventListener('pointerdown', montrer);
  svg.addEventListener('pointerleave', cacher); svg.addEventListener('pointercancel', cacher);
}

/* ---------------- rendu des onglets ---------------- */
function tuile(k, v, s, extra){ return '<div class="card' + (extra || '') + '"><div class="k">' + k + '</div><div class="v' + (extra && extra.indexOf('wide') >= 0 ? ' big' : '') + '">' + v + '</div>' + (s ? '<div class="s">' + s + '</div>' : '') + '</div>'; }
function periodeTxt(){ return etat.jours + ' derniers jours'; }

function rendre(){
  var d = etat.data; if(!d) return;
  var h = '', a = d.activity, u = d.users, c = d.creations, ins = d.installs, se = d.series || [];
  var maj = '<div class="s" style="margin:10px 2px 0">Données réelles · actualisé ' + dateFr(d.generated_at, true) + '</div>';

  if(etat.onglet === 'apercu'){
    var cumul = u.before_period, croissance = se.map(function(x){ cumul += x.signups; return {x: x.day, y: cumul}; });
    h += '<h2>Utilisateurs</h2><div class="grid">'
      + tuile('Comptes inscrits', n(u.total), 'Tous les comptes créés (le compte est facultatif)', ' wide')
      + tuile('Inscrits aujourd’hui', n(u.today)) + tuile('Inscrits sur 7 jours', n(u.d7))
      + tuile('Inscrits sur 30 jours', n(u.d30)) + tuile('Inscrits sur la période', n(u.period), periodeTxt())
      + '</div>';
    h += '<h2>Activité</h2><div class="grid">'
      + tuile('Actifs 24 h', n(a.active_24h)) + tuile('Actifs 7 jours', n(a.active_7d))
      + tuile('Actifs 30 jours', n(a.active_30d)) + tuile('Visiteurs', n(a.visitors_period), periodeTxt())
      + tuile('Visiteurs revenus', n(a.returning_period), 'Revenus un autre jour · ' + periodeTxt()) + tuile('Connexions', n(a.logins_period), periodeTxt())
      + '</div>';
    h += '<div class="card wide" style="margin-top:10px"><div class="k">Personnes actives par jour</div><div class="chart" id="chActifs"></div>'
      + tableHTML(se.slice().reverse(), [['Jour', function(r){ return jourCourt(r.day); }], ['Actifs', function(r){ return n(r.active); }], ['Visiteurs', function(r){ return n(r.visitors); }]]) + '</div>';
    h += '<div class="card wide" style="margin-top:10px"><div class="k">Croissance : comptes inscrits (cumul)</div><div class="chart" id="chCroissance"></div>'
      + tableHTML(croissance.slice().reverse(), [['Jour', function(r){ return jourCourt(r.x); }], ['Inscrits (cumul)', function(r){ return n(r.y); }]]) + '</div>';
    h += '<div class="note"><b>Définitions.</b> Une <b>personne</b> = un compte, ou un appareil sans compte. Un appareil qui s’est connecté au moins une fois est rattaché à son compte : la même personne n’est jamais comptée deux fois sur une période. '
      + '<b>Visiteur</b> = a ouvert l’appli. <b>Actif</b> = a fait au moins une action dans l’éditeur (ouverture de l’éditeur, choix de vêtement, sauvegarde, export). '
      + 'Seuls les appareils qui ont accepté les statistiques anonymes sont comptés. Jours à l’heure de Paris.</div>' + maj;
    main.innerHTML = h;
    graphique('chActifs', se.map(function(x){ return {x: x.day, y: x.active}; }), 'line', ' actifs');
    graphique('chCroissance', croissance, 'line', ' inscrits');
  }

  else if(etat.onglet === 'creations'){
    h += '<h2>Créations</h2><div class="grid">'
      + tuile('Designs enregistrés', n(c.saves_total + c.cloud_designs_total), n(c.saves_total) + ' sur appareil (clics « Enregistrer ») · ' + n(c.cloud_designs_total) + ' en ligne', ' wide')
      + tuile('Vêtements personnalisés', n(c.customized_total), 'Personne × vêtement ayant reçu au moins un élément')
      + tuile('Exports', n(c.exports_total), 'PNG + fichiers, depuis le début')
      + tuile('Sauvegardes', n(c.saves_period + c.cloud_saves_period), periodeTxt())
      + tuile('Exports sur la période', n(c.exports_period), n(c.exports_png_period) + ' PNG · ' + n(c.exports_file_period) + ' fichiers')
      + '</div>';
    var bg = c.by_garment || [], mx = Math.max.apply(null, bg.map(function(g){ return g.customized; }).concat([1]));
    h += '<div class="card wide" style="margin-top:10px"><div class="k">Vêtements personnalisés par type · ' + periodeTxt() + '</div><div class="bars">'
      + (bg.length ? bg.map(function(g){ return '<div class="row"><span>' + esc(NOMS[g.garment] || g.garment) + '</span><span class="track"><span class="fill" style="width:' + (g.customized / mx * 100) + '%"></span></span><span class="n">' + n(g.customized) + '</span><span class="sub">' + n(g.selected) + ' sélection' + (g.selected > 1 ? 's' : '') + '</span></div>'; }).join('')
         : '<div class="s">Aucune donnée sur la période.</div>')
      + '</div></div>';
    h += '<div class="card wide" style="margin-top:10px"><div class="k">Sauvegardes de designs par jour</div><div class="chart" id="chCrea"></div>'
      + tableHTML(se.slice().reverse(), [['Jour', function(r){ return jourCourt(r.day); }], ['Sauvegardes', function(r){ return n(r.creations); }], ['Personnalisés', function(r){ return n(r.customized); }], ['Exports', function(r){ return n(r.exports); }]]) + '</div>';
    h += '<div class="card wide" style="margin-top:10px"><div class="k">Exports par jour</div><div class="chart" id="chExp"></div></div>';
    h += '<div class="note">Les designs enregistrés sur l’appareil restent privés sur le téléphone : seul le nombre de clics « Enregistrer » est connu. Les designs en ligne sont ceux des comptes.</div>' + maj;
    main.innerHTML = h;
    graphique('chCrea', se.map(function(x){ return {x: x.day, y: x.creations}; }), 'col', ' sauvegardes');
    graphique('chExp', se.map(function(x){ return {x: x.day, y: x.exports}; }), 'col', ' exports');
  }

  else if(etat.onglet === 'installs'){
    var plat = ins.by_platform || {};
    h += '<h2>Installations</h2>'
      + '<div class="note"><b>Ce ne sont pas des téléchargements.</b> Une PWA ne passe par aucun store : il n’existe pas de compteur exact. Ces chiffres sont des <b>minimums détectés</b>.</div>'
      + '<div class="grid">'
      + tuile('Appareils installés détectés <span class="tag">minimum</span>', n(ins.detected_devices_total), 'Installation confirmée par le navigateur, ou appli lancée depuis l’écran d’accueil', ' wide')
      + tuile('Installations confirmées', n(ins.installed_events_total), 'Événement du navigateur (Android, ordinateur). Jamais disponible sur iPhone.')
      + tuile('Lancés depuis l’écran d’accueil', n(ins.standalone_devices_total), 'Appareils, depuis le début')
      + tuile('Lancements écran d’accueil', n(ins.standalone_launches_period), periodeTxt())
      + tuile('Ouvertures dans le navigateur', n(ins.browser_launches_period), 'Safari, Chrome… · ' + periodeTxt())
      + '</div>';
    h += '<div class="card wide" style="margin-top:10px"><div class="k">Appareils installés détectés par plateforme</div><table style="margin-top:6px">'
      + (Object.keys(plat).length ? Object.keys(plat).map(function(k){ return '<tr><td>' + esc(PLAT[k] || k) + '</td><td>' + n(plat[k]) + '</td></tr>'; }).join('') : '<tr><td>Aucun pour le moment</td><td></td></tr>') + '</table></div>';
    h += '<h2>À ne pas confondre</h2><div class="grid">'
      + tuile('Visiteurs', n(a.visitors_period), 'Personnes ayant ouvert l’appli · ' + periodeTxt())
      + tuile('Utilisateurs actifs', n(a.active_period), periodeTxt())
      + tuile('Comptes inscrits', n(u.total), 'Depuis le début', ' wide')
      + '</div>';
    h += '<div class="note"><b>Limites sur iPhone.</b> Safari ne signale jamais l’ajout à l’écran d’accueil. On ne le détecte qu’au premier lancement depuis l’icône, et seulement si les statistiques sont acceptées. '
      + 'De plus, l’appli installée a son propre stockage, séparé de Safari : le même iPhone apparaît comme deux appareils (navigateur + écran d’accueil), sauf s’il se connecte à un compte. Une installation jamais ouverte n’est pas comptée.</div>' + maj;
    main.innerHTML = h;
  }

  else if(etat.onglet === 'comptes'){
    h += '<h2>Comptes <span class="s" style="font-family:inherit;font-size:13px">(' + n(etat.usersTotal) + ')</span></h2>';
    h += '<div class="note">Lecture seule. Les e-mails sont masqués ; aucun mot de passe ni jeton n’existe ou n’est affiché (connexion par code).</div><div class="stack">';
    if(!etat.users.length) h += '<div class="card"><div class="s">Aucun compte pour le moment.</div></div>';
    etat.users.forEach(function(x){
      var cl = x.status === 'actif' ? 'ok' : (x.status === 'suspendu' ? 'warn' : '');
      h += '<div class="card user"><div class="em">' + esc(x.email_masked || 'Compte ' + x.user_ref) + (x.is_admin ? ' <span class="tag">admin</span>' : '') + '</div>'
        + '<span class="pill ' + cl + '">' + esc(x.status) + '</span>'
        + '<dl><dt>Inscription</dt><dd>' + dateFr(x.created_at) + '</dd>'
        + '<dt>Dernière connexion</dt><dd>' + dateFr(x.last_sign_in, true) + '</dd>'
        + '<dt>Dernière activité</dt><dd>' + dateFr(x.last_activity, true) + '</dd>'
        + '<dt>Sauvegardes</dt><dd>' + n(x.creations) + '</dd>'
        + '<dt>Designs en ligne</dt><dd>' + n(x.cloud_designs) + '</dd></dl></div>';
    });
    h += '</div>';
    if(etat.users.length < etat.usersTotal) h += '<button class="btn ghost" id="plus" onclick="plusDeComptes()">Afficher plus</button>';
    h += maj;
    main.innerHTML = h;
  }
}
var _rz; window.addEventListener('resize', function(){ clearTimeout(_rz); _rz = setTimeout(rendre, 200); });

/* ---------------- démarrage ---------------- */
if(!window.VB || !VB.enabled) ecranConfig();
else VB.pret().then(function(){ if(!VB.session()) ecranConnexion(); else verifierAcces(); });
</script>
</body>
</html>
